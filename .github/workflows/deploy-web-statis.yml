name: Deploy Web Statis UAS

on:
  push:
    branches:
      - main
    paths:
      - "web-statis/**"
      - ".github/workflows/deploy-web-statis.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest ./web-statis

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to AWS EC2
        run: |
          ssh -i ~/.ssh/aws_key ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'EOF'
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest

            docker stop web-statis-uas || true
            docker rm web-statis-uas || true

            docker run -d \
              --name web-statis-uas \
              --restart unless-stopped \
              --network watchvault-network \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/web-statis-uas:latest

            docker image prune -f
          EOF