name: Deploy Web Dinamis UAS

on:
  push:
    branches:
      - main
    paths:
      - "web-dinamis/**"
      - ".github/workflows/deploy-web-dinamis.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dynamic image
        uses: docker/build-push-action@v6
        with:
          context: ./web-dinamis
          file: ./web-dinamis/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-dinamis-uas:latest

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "web-dinamis/docker-compose.yml,web-dinamis/db/init.sql"
          target: "/home/${{ secrets.AWS_USERNAME }}/web-dinamis-uas"
          strip_components: 1

      - name: Deploy dynamic app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.AWS_USERNAME }}/web-dinamis-uas

            cat > .env <<ENV_EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            MARIADB_ROOT_PASSWORD=root_finchat_password
            MARIADB_DATABASE=finchat_uas
            MARIADB_USER=finchat_user
            MARIADB_PASSWORD=finchat_password
            SESSION_SECRET=finchat_uas_session_secret
            ENV_EOF

            docker compose pull web-dinamis
            docker compose up -d
            docker image prune -f
            docker ps
