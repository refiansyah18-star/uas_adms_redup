services:
  web-dinamis:
    image: ${DOCKERHUB_USERNAME:-redupthedestroyer}/web-dinamis-uas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-dinamis-uas
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      DB_HOST: mariadb-dinamis
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:-watchvault_db}
      DB_USER: ${MARIADB_USER:-watchvault_user}
      DB_PASSWORD: ${MARIADB_PASSWORD:-watchvault_password}
    depends_on:
      mariadb-dinamis:
        condition: service_healthy
    networks:
      - watchvault-network

  mariadb-dinamis:
    image: mariadb:11.4
    container_name: mariadb-dinamis-uas
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_watchvault_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-watchvault_db}
      MARIADB_USER: ${MARIADB_USER:-watchvault_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-watchvault_password}
    volumes:
      - watchvault_mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - watchvault-network

volumes:
  watchvault_mariadb_data:

networks:
  watchvault-network:
    driver: bridge
